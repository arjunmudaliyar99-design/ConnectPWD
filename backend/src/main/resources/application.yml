server:
  port: 8080

spring:
  application:
    name: connectpwd-backend

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb+srv://connectpwd:Arjun%401234@cluster0.ieztbuc.mongodb.net/connectpwd?appName=Cluster0}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASS:connectpwd_dev}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET:default-dev-secret-must-be-at-least-256-bits-long-for-hs256-algorithm}
  access-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}      # 15 minutes
  refresh-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000} # 7 days

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}

r2:
  account-id: ${R2_ACCOUNT_ID:}
  access-key-id: ${R2_ACCESS_KEY_ID:}
  secret-access-key: ${R2_SECRET_ACCESS_KEY:}
  bucket-name: ${R2_BUCKET:connectpwd}
  public-url: ${R2_PUBLIC_URL:}

logging:
  level:
    org.connectpwd: INFO
    org.springframework.security: WARN

---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    org.connectpwd: DEBUG
    org.springframework.security: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod

  # No datasource — all data stored in MongoDB Atlas

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    org.connectpwd: WARN
    org.springframework.security: WARN
